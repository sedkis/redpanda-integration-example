# Loads every dashboard JSON mounted at /var/lib/grafana/dashboards on startup.
apiVersion: 1

providers:
  - name: wiki-pipeline
    orgId: 1
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
